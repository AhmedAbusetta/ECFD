; ===================================================
; ECFD Dialplan Configuration
; ===================================================
;
; Phase 1 (VoIP lab): extensions dial each other directly so 1002 -> 1001 is a
; normal two-way call. This works even when the ECFD backend is down (fail-open).
;
; Phase 2 (media tap, recommended - see audit report): the backend subscribes to ARI with subscribeAll=true, sees
; the new channel, creates a Snoop channel on it plus an External Media channel,
; and bridges those two inside the 'ecfd-stasis' app. The callers' own bridge is
; never handed to ECFD, so a backend crash cannot drop a live call.
; (Previous version sent every call straight into Stasis(), which hangs up
; immediately while no ARI app is connected.)

[general]
static=yes
writeprotect=no

[ecfd-internal]
exten => _100X,1,NoOp(ECFD lab call ${CALLERID(num)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
