; ===================================================
; ECFD Dialplan Configuration
; Routes incoming calls into the Stasis ARI application
; ===================================================

[general]
static=yes
writeprotect=no

[ecfd-internal]
; Dial 1001 (Employee) -> Route to Stasis ARI app
exten => 1001,1,NoOp(Incoming call to Employee from ${CALLERID(all)})
 same => n,Answer()
 same => n,Stasis(ecfd-stasis,1001)
 same => n,Hangup()

; Dial 1002 (Attacker/Caller) -> Route to Stasis ARI app
exten => 1002,1,NoOp(Incoming call to Caller from ${CALLERID(all)})
 same => n,Answer()
 same => n,Stasis(ecfd-stasis,1002)
 same => n,Hangup()
