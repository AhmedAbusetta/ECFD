; ===================================================
; ECFD Asterisk PJSIP Configuration (Controlled VoIP Lab)
; ===================================================

[global]
type=global
user_agent=ECFD-Asterisk-PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Asterisk runs inside Docker, so it must tell the phones the HOST's address, not the
; container's - otherwise calls connect with no audio. telephony/asterisk/mac-setup.sh
; writes that address to pjsip_nat.conf (machine-specific, git-ignored). If the file is
; missing, Asterisk still starts (lab without Docker NAT).
#tryinclude ecfd/pjsip_nat.conf

; --- Employee Endpoint (1001) ---
[1001]
type=endpoint
transport=transport-udp
context=ecfd-internal
disallow=all
; g722 = HD voice (16 kHz) for better speech-to-text; ulaw/alaw as fallback
allow=g722,ulaw,alaw
auth=auth1001
aors=1001
; keep RTP flowing through Asterisk so ECFD can tap it, and survive Docker NAT
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth1001]
type=auth
auth_type=userpass
password=employee_pass_1001
username=1001

[1001]
type=aor
max_contacts=1
; a phone that re-registers (new IP after reconnecting) replaces its old registration
remove_existing=yes
; ping the phone every 30 s: keeps the NAT path open and shows it in "pjsip show contacts"
qualify_frequency=30

; --- Caller / Attacker Endpoint (1002) ---
[1002]
type=endpoint
transport=transport-udp
context=ecfd-internal
disallow=all
allow=g722,ulaw,alaw
auth=auth1002
aors=1002
; keep RTP flowing through Asterisk so ECFD can tap it, and survive Docker NAT
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth1002]
type=auth
auth_type=userpass
password=attacker_pass_1002
username=1002

[1002]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
