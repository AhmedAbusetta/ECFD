; ===================================================
; ECFD Asterisk PJSIP Configuration (Controlled VoIP Lab)
; ===================================================

[global]
type=global
user_agent=ECFD-Asterisk-PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- Employee Endpoint (1001) ---
[1001]
type=endpoint
context=ecfd-internal
disallow=all
allow=ulaw,alaw
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
password=employee_pass_1001
username=1001

[1001]
type=aor
max_contacts=1

; --- Caller / Attacker Endpoint (1002) ---
[1002]
type=endpoint
context=ecfd-internal
disallow=all
allow=ulaw,alaw
auth=auth1002
aors=1002

[auth1002]
type=auth
auth_type=userpass
password=attacker_pass_1002
username=1002

[1002]
type=aor
max_contacts=1
