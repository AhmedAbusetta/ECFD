version: '3.8'

# =========================================================================
# ECFD Lightweight Mock Stack (Zero-GPU, instant local dev)
# Runs PostgreSQL + Asterisk + ASP.NET (with in-memory mock ML engines)
# =========================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecfd-postgres-mock
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecfd_db
      POSTGRES_USER: ecfd_app_user
      POSTGRES_PASSWORD: dev_secret_password
    ports:
      - "5432:5432"

  backend:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: ecfd-backend-mock
    working_dir: /app
    volumes:
      - ../backend:/app
    command: dotnet run --project ECFD.Api/ECFD.Api.csproj --urls "http://0.0.0.0:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ML_USE_MOCK_MODE=true
    ports:
      - "5000:5000"
